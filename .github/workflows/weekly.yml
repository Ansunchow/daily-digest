name: 每周采购清单（云端）
on:
  schedule:
    # UTC 10:00 周日 = 北京时间 18:00 周日
    - cron: '0 10 * * 0'
  workflow_dispatch:
jobs:
  shopping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 推送下一周采购清单
        run: python shopping_list.py
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
